<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bleep Student Assignment Portal | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur-sm">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 mb-3 shadow-inner">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Student Assignment Portal</h1>
      <p class="text-sm text-slate-400 mt-1">Submit Jupyter notebooks & track performance</p>
    </div>

    <!-- Error Banner -->
    <div id="errorBox" class="hidden mb-6 p-4 rounded-xl bg-red-950/50 border border-red-800/60 text-red-300 text-sm">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 flex-shrink-0 text-red-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
        </svg>
        <span id="errorMessage">Error message here</span>
      </div>
    </div>

    <!-- Flow A: Google SSO Button -->
    <a href="/auth/google" class="w-full flex items-center justify-center gap-3 bg-white text-slate-800 hover:bg-slate-100 font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-md">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </a>

    <!-- Divider -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
      <div class="relative flex justify-center text-xs uppercase"><span class="bg-slate-900 px-3 text-slate-500 font-semibold tracking-wider">or sign in with password</span></div>
    </div>

    <!-- Flow B: Email & Password Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
        <input type="email" id="email" required placeholder="student@gmail.com" class="w-full px-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" id="password" required placeholder="••••••••••••" class="w-full px-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center justify-center">
        <span>Sign In to Dashboard</span>
      </button>
    </form>

    <!-- Info Footer -->
    <div class="mt-8 pt-6 border-t border-slate-800 text-center">
      <p class="text-xs text-slate-400">
        Administrator: <span class="text-indigo-400 font-medium">Aman Sah</span> (<a href="mailto:amansah1717@gmail.com" class="underline hover:text-slate-200">amansah1717@gmail.com</a>)
      </p>
      <p class="text-[11px] text-slate-500 mt-1">Single sign-on via Google OpenID Connect & Drive storage sync</p>
    </div>
  </div>

  <script>
    // Check URL parameters for errors
    const params = new URLSearchParams(window.location.search);
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');

    if (params.get('error') === 'unregistered_email') {
      const email = params.get('email') || '';
      errorMessage.textContent = `Email (${email}) is not registered in the student roster. Please contact instructor Aman Sah.`;
      errorBox.classList.remove('hidden');
    } else if (params.get('error') === 'oauth_failed') {
      errorMessage.textContent = 'Google sign-in could not be completed. Please try again or use password login.';
      errorBox.classList.remove('hidden');
    }

    // Handle Form Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing in...';
      errorBox.classList.add('hidden');

      const formData = new FormData();
      formData.append('email', email);
      formData.append('password', password);

      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          body: formData
        });
        const data = await resp.json();

        if (resp.ok && data.status === 'success') {
          window.location.href = data.redirect_url;
        } else {
          errorMessage.textContent = data.detail || 'Invalid email or password.';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorMessage.textContent = 'Connection error. Please try again.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
